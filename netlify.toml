[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* vars are intentionally embedded in the client bundle by Next.js.
  # FIREBASE_ADMIN_PROJECT_ID has the same value as NEXT_PUBLIC_FIREBASE_PROJECT_ID
  # so the scanner false-positives on it. The project ID is not a secret.
  # FIREBASE_ADMIN_PRIVATE_KEY and FIREBASE_ADMIN_CLIENT_EMAIL are NOT listed here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_APP_URL,ALLOWED_DOMAINS,FIREBASE_ADMIN_PROJECT_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"
